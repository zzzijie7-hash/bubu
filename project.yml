name: Bubu
options:
  bundleIdPrefix: com.fenglidawang
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  Bubu:
    type: application
    platform: iOS
    sources:
      - bubu/App
      - bubu/Core
      - bubu/Data
      - bubu/Domain
      - bubu/Services
      - bubu/UI
      - bubu/Resources
    settings:
      base:
        INFOPLIST_FILE: bubu/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.fenglidawang.bubu
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: bubu/Resources/Bubu.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: bubu/Resources/Bubu.entitlements
