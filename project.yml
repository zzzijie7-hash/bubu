name: Bubu
options:
  bundleIdPrefix: com.bubu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  Bubu:
    type: application
    platform: iOS
    sources:
      - bubu/App
      - bubu/Core
      - bubu/Data
      - bubu/Domain
      - bubu/Services
      - bubu/UI
      - bubu/Resources
    settings:
      base:
        INFOPLIST_FILE: bubu/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bubu.app
        CODE_SIGN_STYLE: Automatic